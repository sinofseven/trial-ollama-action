name: Gemma 4 E4B Inference

on:
  workflow_dispatch:

jobs:
  run-gemma:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2 # or install via curl

      - name: Run Inference
        run: |
          ollama run gemma4:e4b "Summarize the latest commit."

